name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true
          lint: true
          check-reservoir-eligibility: true

  smoke:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Print axiom dependencies
        run: bash scripts/audit_axioms.sh
      - name: Upload axiom audit
        uses: actions/upload-artifact@v4
        with:
          name: axiom-audit
          path: |
            Audit/AxiomAudit.generated.lean
            Audit/axioms-report.txt

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: Build API docs
        run: bash scripts/build_docs.sh
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docbuild/.lake/build/doc
